name: Deploy

# Cloudflare Pages へのデプロイ。
#
# Cloudflare 側の Git 連携 (ダッシュボードでリポジトリを繋ぐ方式) を使うなら
# このワークフローは不要なので、ファイルごと削除してよい。
#
# GitHub Actions から流す場合は、リポジトリに次の 2 つを登録する:
#   secrets.CLOUDFLARE_API_TOKEN   … Pages の編集権限を持つ API トークン
#   secrets.CLOUDFLARE_ACCOUNT_ID  … Cloudflare のアカウント ID
# プロジェクト名を変えるときは vars.CLOUDFLARE_PROJECT_NAME を設定する。

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    name: Cloudflare Pages
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: ${{ steps.publish.outputs.deployment-url }}

    steps:
      - uses: actions/checkout@v4

      - name: 資格情報が登録されているか確かめる
        env:
          API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$API_TOKEN" ] || [ -z "$ACCOUNT_ID" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN と CLOUDFLARE_ACCOUNT_ID を Secrets に登録してください。Cloudflare の Git 連携を使う場合は .github/workflows/deploy.yml を削除してください。"
            exit 1
          fi

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: 事前生成
        run: npm run build

      - name: 公開
        id: publish
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >-
            pages deploy build
            --project-name=${{ vars.CLOUDFLARE_PROJECT_NAME || 'study-notes' }}
            --branch=${{ github.ref_name }}
