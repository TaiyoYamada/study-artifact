name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 同じブランチへ続けて push したときは古い実行を打ち切る
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: lint / typecheck / test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Prettier と ESLint
        run: npm run lint

      - name: 型検査 (svelte-check)
        run: npm run check

      - name: 単体テスト
        run: npm run test:unit

      # ノートに書いた出典が実在するかを機械で確かめる。
      # 存在しない論文 URL が混ざったまま公開されないようにするための歯止め。
      - name: 出典リンクの生存確認
        run: npm run check:links -- --all

      # e2e は build + preview に対して走るので、ここでビルドの通過も同時に確かめている
      - name: Playwright のブラウザを用意
        run: npx playwright install --with-deps chromium

      - name: E2E テスト
        run: npm run test:e2e

      - name: 失敗時のレポートを残す
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
          if-no-files-found: ignore

      # この成果物をそのまま公開する。検査を通ったものと配信されるものを一致させる。
      - name: 成果物を残す
        uses: actions/upload-artifact@v7
        with:
          name: site
          path: build/
          retention-days: 7

  deploy:
    name: Cloudflare Pages へ公開
    needs: verify
    # コミット無しでも公開し直せるよう workflow_dispatch でも動かす
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
      url: ${{ steps.publish.outputs.deployment-url }}

    steps:
      # Secrets が未登録のうちは、失敗させずに飛ばす。設定前から赤くし続けないため。
      - name: 資格情報の有無を見る
        id: creds
        env:
          API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$API_TOKEN" ] && [ -n "$ACCOUNT_ID" ]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo '::notice::CLOUDFLARE_API_TOKEN と CLOUDFLARE_ACCOUNT_ID が未登録のため、公開を飛ばしました。設定手順は README を参照してください。'
          fi

      - name: 検査を通った成果物を取り出す
        if: steps.creds.outputs.ready == 'true'
        uses: actions/download-artifact@v8
        with:
          name: site
          path: build

      # 初回の立ち上げだけで効く。既にあるときは何もしない。
      # 作成を無条件に試すと毎回 API が「同名がある」と返し、成功した実行にも
      # 赤い注釈が残って本物の失敗と見分けがつかなくなるため、先に有無を見る。
      # ダッシュボードで作る場合は Direct Upload を選ぶこと (Git 連携にすると
      # Cloudflare 側も勝手にビルドしようとして二重になる)。
      - name: Pages プロジェクトが無ければ作る
        if: steps.creds.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT: ${{ vars.CLOUDFLARE_PROJECT_NAME || 'study-notes' }}
        run: |
          set -uo pipefail
          # 公開と同じ経路 (wrangler + 同じ権限) で見る。REST を直接叩くと
          # トークンに一覧の権限が要り、公開できるのに確認だけ失敗することがある。
          if ! listing=$(npx --yes wrangler@4 pages project list 2>&1); then
            echo "::warning::Pages プロジェクトの一覧を取得できませんでした。公開はそのまま試みます。"
            echo "$listing" | tail -20
            exit 0
          fi
          if printf '%s' "$listing" | grep -qE "(^|[^-[:alnum:]_])${PROJECT}([^-[:alnum:]_]|$)"; then
            echo "Pages プロジェクト $PROJECT は既にあります。作成は飛ばしました。"
            exit 0
          fi
          echo "Pages プロジェクト $PROJECT が無いので作ります。"
          npx --yes wrangler@4 pages project create "$PROJECT" --production-branch main

      - name: 公開
        id: publish
        if: steps.creds.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >-
            pages deploy build
            --project-name=${{ vars.CLOUDFLARE_PROJECT_NAME || 'study-notes' }}
            --branch=${{ github.ref_name }}
